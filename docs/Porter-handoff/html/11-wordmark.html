<style>
body{margin:0}

@keyframes p6Pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,79,0.45)}50%{box-shadow:0 0 0 6px rgba(47,107,79,0)}}
@keyframes p6Grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes p6Rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes p6Ring{from{stroke-dashoffset:94.2}}
.p6-pulse{animation:p6Pulse 2.4s ease-in-out infinite}
.p6-grow{animation:p6Grow 0.9s cubic-bezier(0.2,0.8,0.2,1) 0.2s both;transform-origin:left}
.p6-rise{animation:p6Rise 0.5s cubic-bezier(0.2,0.8,0.2,1) both}
