# Porter benefits catalog: what each card offers. See docs/adr/0002-postgres-for-all-data.md.
#
# Each card lists where its numbers came from and when they were checked:
#   verified = "issuer"     read on the issuer's own card page
#   verified = "secondary"  the issuer page couldn't be read; taken from a dated review
#                           (AwardWallet, The Points Guy). Recheck against the issuer.
#
# Credit fields
#   amount_cents        per period. december_amount_cents overrides December for monthly credits.
#   cadence             monthly | quarterly | semiannual (Jan-Jun, Jul-Dec) | calendar_year
#                       | cardmember_year (resets on the card's anniversary month)
#   delivery            statement_credit is tracked now. uber_cash, travelbank, bilt_cash,
#                       in_app and portal are listed for completeness and tracked later.
#   enrollment          true if the cardholder must enroll, activate or pick something first
#   merchants           lowercase text matched against a purchase's merchant or name
#   categories          Plaid personal finance categories (primary) that qualify
#   credit_patterns     lowercase text matched against the issuer's statement-credit line.
#                       Amex lines were checked against real statements (Nov 2026); others
#                       are first guesses to tune.
#   posts_as_merchant   the credit line shows the merchant's name with no "credit" in it
#                       ("Dunkin' Donuts -$7.00"); it counts when no bigger than the credit
#   channel             where it has to be booked or bought, when that matters
#   ends                last day the credit is offered (inclusive), when the issuer states one
#
# Not included: per-stay credits (Hotel Collection $100, Venture X experience credits),
# spend-unlocked credits (Adobe, Shops at Chase, Southwest), and Global Entry / TSA PreCheck
# (every four years, anchored to the last use).

# Points programs. Cards that pool (Chase UR, Amex MR) share one program.
#
# Card earn fields ([cards.points])
#   program     the program's id below
#   base        points per dollar on everything else
#   rates       bonus rates; a purchase earns the highest one it matches. categories are Plaid
#               personal finance categories, detailed (FOOD_AND_DRINK_RESTAURANT) or primary
#               (TRAVEL); merchants are lowercase text matched against the merchant or name.
#               Annual caps (Gold: $50k restaurants, $25k supermarkets) aren't modelled.
# Only cards with a [cards.points] block count toward points; the rest come later.

[[programs]]
id = "amex-mr"
name = "Membership Rewards"
short_name = "MR"

[[programs]]
id = "chase-ur"
name = "Ultimate Rewards"
short_name = "UR"

